<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">InteractiveWorld — Your world, a little more alive.</title>
  <desc id="desc">A mint geometric object orbits a glowing circle beside the InteractiveWorld wordmark.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f9ef"/><stop offset="1" stop-color="#e2edd8"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#c9f7a5" stop-opacity=".9"/><stop offset="1" stop-color="#c9f7a5" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#53794d" opacity=".13"/></pattern>
